# 版本沿革 / 资产指纹（出包收尾维护；注释不影响 workflow 行为）
# v0.1.0  2026-11-08  K4weread-v0.1.0.zip  bb85bb3735f176de5c07a9cca6c7fa76ef897a6c0b7340752f55e00f39cbcdfd
# v0.1.1  2026-11-08  K4weread-v0.1.1.zip  eba7eb4f478dad8478da2f6cea6b81f50e17d66805f56d12a05320ae88dae23e
# v0.1.2  2026-11-10  K4weread-v0.1.2.zip  78695627f4ed5bc06d5469ee53ac99e901f3e344a96f2ab528328f6a9ae7dd43
name: release

# Release assets are produced ONLY here (never by hand on a workstation).
# Pushing a v* tag builds K4weread-v<version>.zip + .sha256 and publishes
# both as GitHub Release assets.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release package (zip + sha256)
        run: sh tools/build_release.sh

      - name: Verify checksum
        run: sha256sum -c K4weread-v*.zip.sha256

      - name: Assert zip layout (moved from CI 2026-11-10)
        run: |
          python3 - <<'PY'
          import zipfile, glob
          z = glob.glob('K4weread-v*.zip')[0]
          names = zipfile.ZipFile(z).namelist()
          files = {n for n in names if not n.endswith('/')}
          required = {
              'K4weread/kual/menu.json',
              'K4weread/kual/config.xml',
              'K4weread/kual/bin/k4weread.sh',
              'K4weread/README.md',
              'K4weread/LICENSE',
          }
          assert required <= files, sorted(files)
          forbidden = [n for n in files
                       if n.startswith(('K4weread/handoffs/', 'K4weread/tools/', 'K4weread/.git'))
                       or '__MACOSX' in n]
          assert not forbidden, forbidden
          print('zip layout OK:', len(files), 'files')
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            K4weread-v*.zip K4weread-v*.zip.sha256 \
            --verify-tag \
            --title "K4weread ${GITHUB_REF_NAME}" \
            --notes "K4weread ${GITHUB_REF_NAME} — assets built by the release workflow from the tagged commit."
