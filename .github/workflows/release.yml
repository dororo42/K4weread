# 版本沿革 / 资产指纹（出包收尾维护；注释不影响 workflow 行为）
# v0.1.0  2026-11-08  K4weread-v0.1.0.zip  bb85bb3735f176de5c07a9cca6c7fa76ef897a6c0b7340752f55e00f39cbcdfd
# v0.1.1  2026-11-08  K4weread-v0.1.1.zip  eba7eb4f478dad8478da2f6cea6b81f50e17d66805f56d12a05320ae88dae23e
name: release

# Release assets are produced ONLY here (never by hand on a workstation).
# Pushing a v* tag builds K4weread-v<version>.zip + .sha256 and publishes
# both as GitHub Release assets.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release package (zip + sha256)
        run: sh tools/build_release.sh

      - name: Verify checksum
        run: sha256sum -c K4weread-v*.zip.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            K4weread-v*.zip K4weread-v*.zip.sha256 \
            --verify-tag \
            --title "K4weread ${GITHUB_REF_NAME}" \
            --notes "K4weread ${GITHUB_REF_NAME} — assets built by the release workflow from the tagged commit."
